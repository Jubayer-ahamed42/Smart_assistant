name: Facebook Page 24/7 Autonomous Poster

on:
  schedule:
    # 7:00 AM BST (Bangladesh Time) = 01:00 UTC
    - cron: '0 1 * * *'
    # 12:00 PM BST (Bangladesh Time) = 06:00 UTC
    - cron: '0 6 * * *'
    # 8:00 PM BST (Bangladesh Time) = 14:00 UTC
    - cron: '0 14 * * *'
  
  # ম্যানুয়াল ট্রিগারের জন্য (যে কোনো সময় রান বা টেস্ট করার সুবিধা)
  workflow_dispatch:
    inputs:
      slot:
        description: 'পোস্টের স্লট নির্বাচন করুন'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - noon
          - night
      dry_run:
        description: 'ড্রাই-রান মোড (ফেসবুকে পোস্ট হবে না, শুধু টেস্ট হবে)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  auto_post:
    name: Generate & Post Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          TIMEZONE: Asia/Dhaka
          PYTHONIOENCODING: utf-8
        run: |
          SLOT_ARG="${{ github.event.inputs.slot || 'auto' }}"
          DRY_RUN_ARG="${{ github.event.inputs.dry_run == true && '--dry-run' || '' }}"
          python main.py --slot "$SLOT_ARG" $DRY_RUN_ARG

      - name: Commit and Push Updated Post History
        if: ${{ github.event.inputs.dry_run != true }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add post_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update post history [skip ci]" && git push)
